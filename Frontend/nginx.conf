server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;

    # App HTML — no cache so updates are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # WASM files — set correct MIME type via a local types{} override so that
    # the http-level mime.types inheritance is NOT broken for all other files.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # JS / CSS / data assets
    location ~* \.(js|css|data)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
